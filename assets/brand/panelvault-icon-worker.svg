<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024" role="img" aria-label="PV Worker">
  <title>PV Worker</title>
  <!--
    Worker app - hi-vis amber, the way a cabinet warning label is printed.
    Full-bleed square: iOS applies its own corner mask, so no rounding here.
    Geometry is shared with panelvault-mark.svg and tools/make_app_icons.swift.
  -->
  <defs>
    <linearGradient id="pv-ground-worker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC61F"/>
      <stop offset="1" stop-color="#F58400"/>
    </linearGradient>
    <mask id="pv-carve-worker" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <path d="M58 20 L33 55 L46 55 L42 80 L67 45 L54 45 Z"
            fill="#000" stroke="#000" stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="3"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="url(#pv-ground-worker)"/>
  <g fill="#14181B">
    <g mask="url(#pv-carve-worker)" opacity=".74">
      <rect x="20" y="24.0000" width="60" height="10.6" rx="2.6"/>
      <rect x="20" y="38.0667" width="60" height="10.6" rx="2.6"/>
      <rect x="20" y="52.1333" width="60" height="10.6" rx="2.6"/>
      <rect x="20" y="66.2000" width="60" height="10.6" rx="2.6"/>
    </g>
    <path d="M58 20 L33 55 L46 55 L42 80 L67 45 L54 45 Z"
          stroke="#14181B" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
