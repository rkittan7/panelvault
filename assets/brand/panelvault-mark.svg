<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="PanelVault">
  <title>PanelVault</title>
  <!--
    The PanelVault mark: four breaker rails with a lightning bolt cut through
    them. The gap around the bolt is part of the drawing, not a shadow - it is
    what makes the rails and the bolt read as one object.

    Drawn in a single colour so it can be tinted by the caller. Geometry is
    shared with tools/make_app_icons.swift; change both together.
  -->
  <defs>
    <mask id="pv-carve" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <path d="M58 20 L33 55 L46 55 L42 80 L67 45 L54 45 Z"
            fill="#000" stroke="#000" stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="3"/>
    </mask>
  </defs>
  <g fill="currentColor">
    <g mask="url(#pv-carve)" opacity=".74">
      <rect x="20" y="24.0000" width="60" height="10.6" rx="2.6"/>
      <rect x="20" y="38.0667" width="60" height="10.6" rx="2.6"/>
      <rect x="20" y="52.1333" width="60" height="10.6" rx="2.6"/>
      <rect x="20" y="66.2000" width="60" height="10.6" rx="2.6"/>
    </g>
    <path d="M58 20 L33 55 L46 55 L42 80 L67 45 L54 45 Z"
          stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
