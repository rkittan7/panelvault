<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2F2F7">
  <title>PanelVault Cloud</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    /* Applied before first paint, so choosing a dark skin does not flash a
       light page on every load. */
    (function () {
      try {
        var saved = localStorage.getItem("panelvault.skin");
        if (saved) document.documentElement.dataset.theme = saved;
      } catch (error) {
        /* Private mode or blocked storage: fall back to the default skin. */
      }
    })();
  </script>
</head>
<body>
  <div id="app">

    <!-- ============================ Auth ============================ -->
    <section id="auth" class="auth hidden">
      <div class="auth-inner">
        <div class="auth-brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg>
          </div>
          <h1>PanelVault <span>Cloud</span></h1>
          <p>The company warehouse, from anywhere.</p>
        </div>

        <div class="seg" role="tablist" aria-label="Sign in or sign up">
          <button data-tab="signin" class="active" type="button" role="tab" aria-selected="true" aria-controls="form-signin">Sign in</button>
          <button data-tab="signup" type="button" role="tab" aria-selected="false" aria-controls="form-signup">Sign up</button>
        </div>

        <form id="form-signin" class="auth-form" role="tabpanel">
          <div class="ios-group">
            <label class="ios-row">
              <span>Company</span>
              <input name="companyCode" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="K7M2XQ" required>
            </label>
            <label class="ios-row">
              <span>Name</span>
              <input name="name" autocomplete="username" placeholder="Your name" required>
            </label>
            <label class="ios-row">
              <span>Password</span>
              <input name="password" type="password" autocomplete="current-password" placeholder="Required" required>
            </label>
          </div>
          <button class="btn-ios" type="submit">Sign in</button>
        </form>

        <form id="form-signup" class="auth-form hidden" role="tabpanel">
          <div class="ios-group" id="signup-mode" role="radiogroup" aria-label="How are you signing up?">
            <button type="button" class="ios-row choice active" data-mode="join" role="radio" aria-checked="true">
              <span class="choice-text">
                <strong>Join a team</strong>
                <small>You were sent an invite code</small>
              </span>
              <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
            </button>
            <button type="button" class="ios-row choice" data-mode="create" role="radio" aria-checked="false">
              <span class="choice-text">
                <strong>Start a company</strong>
                <small>You're the boss, setting it up</small>
              </span>
              <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
            </button>
          </div>

          <div class="ios-group" id="signup-join">
            <label class="ios-row">
              <span>Invite code</span>
              <input name="inviteCode" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="From your boss" required>
            </label>
            <!-- Filled only by a /#join/COMPANY/INVITE link. Left empty otherwise,
                 and the server then resolves the company from the invite code. -->
            <input type="hidden" name="companyCode">
          </div>

          <div class="ios-group hidden" id="signup-create">
            <label class="ios-row">
              <span>Company</span>
              <input name="companyName" placeholder="Kittan Electric" required disabled>
            </label>
          </div>

          <div class="ios-group">
            <label class="ios-row">
              <span>Name</span>
              <input name="name" placeholder="Your name" required>
            </label>
            <label class="ios-row">
              <span>Password</span>
              <input name="password" type="password" minlength="6" autocomplete="new-password" placeholder="6+ characters" required>
            </label>
          </div>

          <p class="ios-foot" id="signup-hint">Your boss creates the invite code in Team. Ask for one if you don't have it yet.</p>
          <button class="btn-ios" type="submit">Create account</button>
        </form>

        <p id="auth-error" class="form-error hidden" role="alert"></p>
      </div>
    </section>

    <!-- ============================ Shell ============================ -->
    <section id="main" class="shell hidden">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark sm" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg>
          </div>
          <div class="sidebar-brand-text">
            <strong id="company-name"></strong>
            <span id="company-code" class="mono"></span>
          </div>
        </div>

        <nav class="nav" id="nav"></nav>

        <div class="sidebar-foot">
          <div class="skin">
            <span class="skin-label" id="skin-label">Skin</span>
            <select id="skin-select" aria-labelledby="skin-label">
              <option value="cupertino">Cupertino</option>
              <option value="neon-nights">Neon Nights</option>
              <option value="miami">Miami</option>
              <option value="ultraviolet">Ultraviolet</option>
              <option value="solar-flare">Solar Flare</option>
              <option value="terminal">Terminal</option>
              <option value="bubblegum">Bubblegum</option>
              <option value="blueprint">Blueprint</option>
              <option value="field">Field</option>
            </select>
          </div>
          <div class="user-chip">
            <div class="avatar" id="me-avatar"></div>
            <div class="user-chip-text">
              <strong id="me-name"></strong>
              <span id="me-role"></span>
            </div>
            <button id="logout" class="icon-btn" title="Sign out" aria-label="Sign out">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            </button>
          </div>
        </div>
      </aside>

      <div class="content">
        <div id="view-dashboard" class="view"></div>
        <div id="view-stock" class="view hidden"></div>
        <div id="view-catalog" class="view hidden"></div>
        <div id="view-deliveries" class="view hidden"></div>
        <div id="view-projects" class="view hidden"></div>
        <div id="view-boards" class="view hidden"></div>
        <div id="view-board-create" class="view hidden"></div>
        <div id="view-project-create" class="view hidden"></div>
        <div id="view-board-detail" class="view hidden"></div>
        <div id="view-team" class="view hidden"></div>
      </div>
    </section>
  </div>

  <div id="modal-root"></div>
  <script>
    /* Skin picker. Kept out of app.js so the chrome keeps working even if the
       portal bundle fails to load. */
    (function () {
      var KEY = "panelvault.skin";
      var select = document.getElementById("skin-select");
      var meta = document.querySelector('meta[name="theme-color"]');
      if (!select) return;

      function syncBrowserChrome() {
        if (!meta) return;
        var ground = getComputedStyle(document.documentElement)
          .getPropertyValue("--bg")
          .trim();
        if (ground) meta.setAttribute("content", ground);
      }

      select.value = document.documentElement.dataset.theme || "cupertino";
      syncBrowserChrome();

      select.addEventListener("change", function () {
        document.documentElement.dataset.theme = select.value;
        try {
          localStorage.setItem(KEY, select.value);
        } catch (error) {
          /* Not persisting is survivable; the skin still applies this session. */
        }
        syncBrowserChrome();
      });
    })();
  </script>
  <script type="module" src="/app.js"></script>
</body>
</html>
