<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2F2F7">
  <title>PanelVault Cloud</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    /* Applied before first paint, so choosing a dark skin does not flash a
       light page on every load. */
    (function () {
      try {
        var saved = localStorage.getItem("panelvault.skin");
        if (saved) document.documentElement.dataset.theme = saved;
      } catch (error) {
        /* Private mode or blocked storage: fall back to the default skin. */
      }
    })();
  </script>
</head>
<body>
  <div id="app">

    <!-- ============================ Auth ============================ -->
    <section id="auth" class="auth hidden">
      <div class="auth-inner">
        <div class="auth-brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg>
          </div>
          <h1>PanelVault <span>Cloud</span></h1>
          <p>The company warehouse, from anywhere.</p>
        </div>

        <div class="auth-card">
          <div class="seg" role="tablist">
            <button data-tab="login" class="active">Sign in</button>
            <button data-tab="create">New company</button>
            <button data-tab="join">Invite</button>
          </div>

          <form id="form-login" class="auth-form">
            <label>Company code
              <input name="companyCode" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="K7M2XQ" required>
            </label>
            <label>Your name
              <input name="name" autocomplete="username" required>
            </label>
            <label>Password
              <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button class="btn-primary" type="submit">Sign in</button>
          </form>

          <form id="form-create" class="auth-form hidden">
            <label>Company name
              <input name="companyName" placeholder="Kittan Electric" required>
            </label>
            <label>Your name
              <input name="name" required>
            </label>
            <label>Password
              <input name="password" type="password" minlength="6" autocomplete="new-password" required>
            </label>
            <p class="hint">You become the owner. You'll get a company code and invite links for your team.</p>
            <button class="btn-primary" type="submit">Create company</button>
          </form>

          <form id="form-join" class="auth-form hidden">
            <label>Company code
              <input name="companyCode" autocapitalize="characters" autocomplete="off" spellcheck="false" required>
            </label>
            <label>Invite code
              <input name="inviteCode" autocapitalize="characters" autocomplete="off" spellcheck="false" required>
            </label>
            <label>Your name
              <input name="name" required>
            </label>
            <label>Choose a password
              <input name="password" type="password" minlength="6" autocomplete="new-password" required>
            </label>
            <button class="btn-primary" type="submit">Join company</button>
          </form>

          <p id="auth-error" class="form-error hidden" role="alert"></p>
        </div>
      </div>
    </section>

    <!-- ============================ Shell ============================ -->
    <section id="main" class="shell hidden">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark sm" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg>
          </div>
          <div class="sidebar-brand-text">
            <strong id="company-name"></strong>
            <span id="company-code" class="mono"></span>
          </div>
        </div>

        <nav class="nav" id="nav"></nav>

        <div class="sidebar-foot">
          <div class="skin">
            <span class="skin-label" id="skin-label">Skin</span>
            <select id="skin-select" aria-labelledby="skin-label">
              <option value="cupertino">Cupertino</option>
              <option value="neon-nights">Neon Nights</option>
              <option value="miami">Miami</option>
              <option value="ultraviolet">Ultraviolet</option>
              <option value="solar-flare">Solar Flare</option>
              <option value="terminal">Terminal</option>
              <option value="bubblegum">Bubblegum</option>
              <option value="blueprint">Blueprint</option>
              <option value="field">Field</option>
            </select>
          </div>
          <div class="user-chip">
            <div class="avatar" id="me-avatar"></div>
            <div class="user-chip-text">
              <strong id="me-name"></strong>
              <span id="me-role"></span>
            </div>
            <button id="logout" class="icon-btn" title="Sign out" aria-label="Sign out">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            </button>
          </div>
        </div>
      </aside>

      <div class="content">
        <div id="view-dashboard" class="view"></div>
        <div id="view-stock" class="view hidden"></div>
        <div id="view-boards" class="view hidden"></div>
        <div id="view-team" class="view hidden"></div>
      </div>
    </section>
  </div>

  <div id="modal-root"></div>
  <script>
    /* Skin picker. Kept out of app.js so the chrome keeps working even if the
       portal bundle fails to load. */
    (function () {
      var KEY = "panelvault.skin";
      var select = document.getElementById("skin-select");
      var meta = document.querySelector('meta[name="theme-color"]');
      if (!select) return;

      function syncBrowserChrome() {
        if (!meta) return;
        var ground = getComputedStyle(document.documentElement)
          .getPropertyValue("--bg")
          .trim();
        if (ground) meta.setAttribute("content", ground);
      }

      select.value = document.documentElement.dataset.theme || "cupertino";
      syncBrowserChrome();

      select.addEventListener("change", function () {
        document.documentElement.dataset.theme = select.value;
        try {
          localStorage.setItem(KEY, select.value);
        } catch (error) {
          /* Not persisting is survivable; the skin still applies this session. */
        }
        syncBrowserChrome();
      });
    })();
  </script>
  <script type="module" src="/app.js"></script>
</body>
</html>
