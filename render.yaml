services:
  - type: web
    name: panelvault-cloud
    runtime: node
    # Pilot phones must not wait for a sleeping free instance to wake up.
    plan: starter
    region: frankfurt
    rootDir: webapp
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: PUBLIC_BASE_URL
        value: https://cloud.panel-vault.com
      - key: PASSWORD_RESET_WEBHOOK_URL
        sync: false
      - key: PASSWORD_RESET_WEBHOOK_SECRET
        sync: false
